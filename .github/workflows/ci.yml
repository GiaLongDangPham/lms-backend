name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: lms_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lms -d lms_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://lms:ci_password@localhost:5432/lms_test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:check
      - name: Smoke test compiled API against PostgreSQL
        shell: bash
        run: |
          node dist/server.js &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/api/ready
